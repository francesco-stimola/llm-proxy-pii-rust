name: CI

# Lean correctness gate: fmt + clippy + test (default and --features onnx) + an MSRV build.
# Its job is to make PRs — Dependabot's dependency bumps ESPECIALLY — self-verifying: a bump
# that fails to compile or breaks a test must never reach main green-in-the-UI.
#
# It deliberately does NOT build the release targets (that cross-compile stays in
# manual-build.yml and the tag release, via release-build.yml). This is a fast
# "does it still build and pass tests?" check on one platform, not a cross-compile.
#
# History: this file was once disabled (ci.yml.disabled) for a tag-driven-only pipeline that
# ran nothing on push/PR. It was brought back TRIMMED when Dependabot was enabled and its
# version-update PRs needed a build/test gate. See docs/DEVLOG.md.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege (CodeQL actions/missing-workflow-permissions) — build + test need only read.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The version is READ FROM rust-toolchain.toml and never written here — the same reason the
      # msrv job below reads its floor out of Cargo.toml. Two places that must agree eventually
      # will not, and the one that drifts is the one nobody looks at.
      - id: toolchain
        shell: bash
        run: echo "value=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.value }}
          components: rustfmt
      - run: cargo fmt --check

  # One leg for the default (structured-only) build, one for
  # --features onnx (ONNX NER). Model-dependent tests are #[ignore]d, so the onnx leg compiles
  # and runs everything except the live-model checks — no model file is needed (docs/TESTING.md).
  #
  # DO NOT DELETE THE `default` LEG AS REDUNDANT. The tempting argument is "DEP-01
  # (tests/dependency_footprint.rs) guards the dependency-footprint invariant, and it runs in the
  # onnx leg too" — true (it shells `cargo tree` with no --features, so it asserts the same thing
  # in both legs) and exactly why the leg looks droppable. What it actually guards is what NOTHING
  # else in CI compiles:
  #   1. the default feature set links and passes its tests without the native stack at all, and
  #   2. `src/server.rs`'s `#[cfg(not(feature = "onnx"))]` block — the ONLY not-onnx path in the
  #      tree, and the one that raises "NER_REQUIRED is set but this binary was built without the
  #      `onnx` feature". That error is the backstop the whole manual-verification procedure
  #      leans on (docs/MANUAL_VERIFICATION.md); the onnx leg cfg's it out and never builds it.
  # A guard whose reason is recorded wrong is a guard someone deletes later while being perfectly
  # reasonable. (Reviewer finding, 2026-07-16.)
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            features: ""
          - name: onnx
            features: "--features onnx"
    steps:
      - uses: actions/checkout@v7
      # Pinned, and read from the file — see the fmt job. This is the gate the pin exists for:
      # it is the one that went red on `main` for four days when stable moved under it.
      - id: toolchain
        shell: bash
        run: echo "value=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.value }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: clippy
        run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings
      - name: test
        run: cargo test ${{ matrix.features }}

  # Build on the declared MSRV so `rust-version` in Cargo.toml is a checked floor, not a claim
  # nothing verifies (the M5-R5 lesson). The floor is READ FROM Cargo.toml, not hardcoded here,
  # so CI and the manifest can't drift. `--no-deps` reads only the workspace manifest, so the
  # runner's preinstalled cargo parses it without resolving the edition2024 dependency tree.
  msrv:
    name: msrv (from Cargo.toml, --features onnx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: msrv
        run: echo "value=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.value }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      # RUSTUP_TOOLCHAIN, and it is the difference between this job checking the floor and this job
      # quietly checking nothing. Since 2026-09-11 there is a `rust-toolchain.toml` in the tree, and
      # a directory override BEATS the default toolchain the action above just set: without this
      # line `cargo check` would run on the pinned channel, the floor would stop being verified, and
      # the job would stay green while saying something it no longer measures. That is the M5-R5
      # failure mode — a floor claimed rather than checked — reintroduced by the fix for a different
      # one. Measured in the repository on 2026-09-11, with the file in place and the floor at
      # 1.89: `cargo --version` reports **1.98.1** — the pin — while
      # `RUSTUP_TOOLCHAIN=1.89 cargo --version` reports 1.89.0. The environment variable wins over
      # a directory override; the action's default toolchain does not.
      - run: cargo check --all-targets --features onnx
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.value }}
