name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  # One job for the default (structured-only, native-dependency-free) build, one
  # for --features onnx (ONNX NER). Model-dependent tests are #[ignore]d, so the
  # onnx job compiles and runs everything except the live-model checks — no
  # model file is needed in CI (see docs/TESTING.md).
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            features: ""
          - name: onnx
            features: "--features onnx"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: clippy
        run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings
      - name: test
        run: cargo test ${{ matrix.features }}

  # Actually BUILD on the declared MSRV (M5-R5). Without this, `rust-version` in
  # Cargo.toml is a claim nothing checks: it makes cargo refuse a too-OLD toolchain,
  # but it cannot notice when the crate drifts PAST the declared floor. It had — the
  # previously-declared 1.82 could not even parse the dependency tree.
  #
  # ONE floor, 1.89: the shipped product runs with `onnx` ON, so that is the MSRV that
  # means anything. (`default` happens to build on 1.86, but nobody deploys it, so we
  # don't promise it — a second number to keep honest, buying nothing.)
  #
  # `cargo check` is enough — `test` already runs on stable above; this job answers only
  # "does it still compile on the oldest toolchain we promise?".
  msrv:
    name: msrv (1.89, --features onnx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --all-targets --features onnx
