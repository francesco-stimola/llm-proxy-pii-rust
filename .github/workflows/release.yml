name: Release

# Cuts a GitHub Release: builds every target (via the reusable build.yml) and publishes the
# binaries. Triggers ONLY on a `v*.*.*` tag — there is deliberately NO `workflow_dispatch` here,
# so no manual run can ever publish a release. That was M5-R11's whole worry, and it is now
# structural (a workflow with no manual trigger and no publish path elsewhere) rather than an
# `if`-gate that has to be got right. On-demand, throwaway builds live in `manual-build.yml`.
#
# CI (ci.yml) is the correctness gate on every push/PR; this workflow only *packages* what a
# tag says is ready. Run `manual-build.yml` first to confirm every target still compiles before
# you tag — nothing here builds until the tag is pushed.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # Reuse the exact same matrix the manual build uses — one definition, no drift. Release
  # artifacts are consumed immediately by `publish`, so they need only a short retention.
  build:
    uses: ./.github/workflows/build.yml
    with:
      retention-days: 3

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p out
          find artifacts -type f -exec cp {} out/ \;

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
