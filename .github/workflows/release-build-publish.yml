name: Release build & publish

# Cuts a GitHub Release: builds every target (via the reusable release-build.yml) and publishes
# the binaries. Triggers ONLY on a `v*.*.*` tag — there is deliberately NO `workflow_dispatch`
# here, so no manual run can ever publish a release. That was M5-R11's whole worry, and it is now
# structural (a workflow with no manual trigger and no publish path elsewhere) rather than an
# `if`-gate that has to be got right. On-demand, throwaway builds live in `manual-build.yml`.
#
# `ci.yml` does run on push/PR, but it deliberately does not cross-compile — so this tag build is
# still the only automated cross-target compile that gates a release, and its status badge is what
# the READMEs show ("last tag built successfully?"). Run `manual-build.yml` on a branch FIRST to
# catch a target break before tagging — nothing here builds until the tag is pushed.
on:
  push:
    tags:
      - "v*.*.*"

# Least-privilege default for every job (CodeQL actions/missing-workflow-permissions). The
# `build` job (which only calls the reusable workflow) inherits this read-only token; the
# `publish` job overrides it with `contents: write` below — the one privilege that creates
# the Release. `write` subsumes `read`, so publish needs nothing else.
permissions:
  contents: read

jobs:
  # Reuse the exact same matrix CI and the manual build use — one definition, no drift. Release
  # artifacts are consumed immediately by `publish`, so they need only a short retention.
  build:
    uses: ./.github/workflows/release-build.yml
    with:
      retention-days: 3

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # v8 is the current major on Node 24 (v6 still targets Node 20; v7 was the first on Node 24).
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Flattening is only safe while every binary has a unique basename. Since M9.1 there are
      # several artifacts per target (standard / cuda / webgpu), and the suffixing that keeps them
      # distinct lives in the *build* workflow — so a mistake there would land here as a silent
      # overwrite, publishing fewer binaries than were built with nothing to show it went wrong.
      # Fail loudly instead: a release missing an accelerator build is worse than a failed job.
      - name: Flatten artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          built=$(find artifacts -type f | wc -l)
          find artifacts -type f -exec cp -n {} out/ \;
          published=$(find out -type f | wc -l)
          if [ "$built" -ne "$published" ]; then
            echo "::error::basename collision: $built artifacts built but only $published published."
            find artifacts -type f -printf '%f\n' | sort | uniq -d
            exit 1
          fi
          echo "published $published binaries:"
          find out -type f -printf '  %f\n' | sort

      - uses: softprops/action-gh-release@v3
        with:
          files: out/*
          generate_release_notes: true
