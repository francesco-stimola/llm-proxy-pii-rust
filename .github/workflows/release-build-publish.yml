name: Release build & publish

# Cuts a GitHub Release: builds every target (via the reusable release-build.yml) and publishes
# the binaries. Triggers ONLY on a `v*.*.*` tag — there is deliberately NO `workflow_dispatch`
# here, so no manual run can ever publish a release. That was M5-R11's whole worry, and it is now
# structural (a workflow with no manual trigger and no publish path elsewhere) rather than an
# `if`-gate that has to be got right. On-demand, throwaway builds live in `manual-build.yml`.
#
# `ci.yml` does run on push/PR, but it deliberately does not cross-compile — so this tag build is
# still the only automated cross-target compile that gates a release, and its status badge is what
# the READMEs show ("last tag built successfully?"). Run `manual-build.yml` on a branch FIRST to
# catch a target break before tagging — nothing here builds until the tag is pushed.
#
# Three guards run before anything is published, and each closes a different way a release can be
# a lie: the ROADMAP must name the tag as cut, `Cargo.toml` must agree with it, and `CHANGELOG.md`
# must describe it. All three are checked at tag push — the one moment where refusing is cheap.
on:
  push:
    tags:
      - "v*.*.*"

# Least-privilege default for every job (CodeQL actions/missing-workflow-permissions). The
# `build` job (which only calls the reusable workflow) inherits this read-only token; the
# `publish` job overrides it with `contents: write` below — the one privilege that creates
# the Release. `write` subsumes `read`, so publish needs nothing else.
permissions:
  contents: read

jobs:
  # Reuse the exact same matrix CI and the manual build use — one definition, no drift. Release
  # artifacts are consumed immediately by `publish`, so they need only a short retention.
  build:
    uses: ./.github/workflows/release-build.yml
    with:
      retention-days: 3

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # **A release must not exist that the docs cannot explain.** The ROADMAP status table is
      # where a reader looks to answer "what is the latest version, and what is in it?", and
      # nothing forced the two to agree: v1.2.0 was cut once while the table said nothing about
      # it. Remembering is not a mechanism, so this is checked at the one moment it matters —
      # tag push, before anything is published — and a release that would leave the docs silent
      # simply does not happen.
      #
      # The convention that makes a *future* tag legal rather than a lie: write
      # `tag vX.Y.Z (planned)` while it is intended but not yet cut, and drop `(planned)` when it
      # exists. So the table can always name the version it is heading for; only an unqualified
      # claim asserts the tag is real, and only that is checked here.
      - name: The ROADMAP must name this release
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          table="docs/ROADMAP.md"
          # ONLY the Status table's milestone rows are evidence. Scoping this matters and was
          # caught by a dry run before the first real use: the prose that *documents* this
          # convention necessarily contains an example of the `(planned)` form, and a whole-file
          # grep read that sentence as a statement about the release being cut. Prose must never
          # be able to move a guard — so the guard reads the table, which is the artifact the
          # claim actually lives in.
          rows=$(grep -E '^\| \[M' "$table" || true)
          if printf '%s\n' "$rows" | grep -qE "tag \`${tag}\`( |\`|$)" && \
             ! printf '%s\n' "$rows" | grep -qE "tag \`${tag}\`.*\(planned\)"; then
            echo "OK: $table names $tag as a cut release."
            printf '%s\n' "$rows" | grep -E "tag \`${tag}\`"
          else
            echo "::error::$table does not name $tag as a cut release."
            echo "Add it to the Status table on the milestone it was cut from, e.g."
            echo "    | [M9.1 — …](#m91) | ✅ complete · tag \`${tag}\` |"
            echo "If the tag is still only intended, the table may say 'tag \`${tag}\` (planned)' —"
            echo "but then it is not ready to be published."
            echo "--- current tag notations in the Status table ---"
            printf '%s\n' "$rows" | grep -E "tag \`v[0-9]" || echo "(none at all)"
            exit 1
          fi

      # The sibling of the check above, on the other axis. That one guarantees the docs can explain
      # the release; this one guarantees the release is what it says it is — a `v1.3.0` tag cut
      # while the manifest still reads `1.2.0` would publish ten binaries that report a version
      # nobody released, and the ROADMAP check cannot see that (it only reads the tag name).
      #
      # The anchor is `^version = "`, which is exactly one line in Cargo.toml: dependency versions
      # live inside inline tables (`ort = { version = … }`) and never start a line, and
      # `rust-version` does not match either.
      - name: The tag must match Cargo.toml
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          expected="${tag#v}"
          manifest=$(grep -m1 -E '^version = "' Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')
          if [ "$manifest" = "$expected" ]; then
            echo "OK: tag $tag matches Cargo.toml version $manifest."
          else
            echo "::error::tag $tag says $expected, but Cargo.toml says $manifest."
            echo "Bump the package version to $expected and re-cut the tag, or tag v$manifest."
            exit 1
          fi

      # The third guard, same family as the two above. Those two ask "can the docs explain this
      # release?" and "is it what it says it is?"; this one asks the question a reader of the
      # release page actually has — **what changed?** — and makes the answer a precondition rather
      # than a follow-up. `generate_release_notes` alone answers it with the raw commit list, which
      # for this repo means a release's two real features buried under forty review-round commits.
      #
      # Extraction is by literal prefix, not regex: a version contains dots, and `1.2.1` as a
      # pattern also matches `1x2x1`. The section runs to the next `## ` heading, so the file's own
      # order (newest first) is the only convention this depends on.
      - name: The CHANGELOG must describe this release
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          file="CHANGELOG.md"
          awk -v v="$version" '
            BEGIN { hdr = "## [" v "]" }
            index($0, hdr) == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' "$file" > release-body.md
          if ! grep -q '[^[:space:]]' release-body.md; then
            echo "::error::$file has no section for $tag."
            echo "Add one at the top of the file, newest first:"
            echo "    ## [${version}] — $(date -u +%Y-%m-%d)"
            echo "and describe what changed for someone running this version."
            echo "--- sections currently in $file ---"
            grep -E '^## \[' "$file" || echo "(none at all)"
            exit 1
          fi
          echo "OK: $file describes $tag ($(wc -l < release-body.md) lines)."

      # v8 is the current major on Node 24 (v6 still targets Node 20; v7 was the first on Node 24).
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Flattening is only safe while every binary has a unique basename. Since M9.1 there are
      # several artifacts per target (standard / cuda / webgpu), and the suffixing that keeps them
      # distinct lives in the *build* workflow — so a mistake there would land here as a silent
      # overwrite, publishing fewer binaries than were built with nothing to show it went wrong.
      # Fail loudly instead: a release missing an accelerator build is worse than a failed job.
      - name: Flatten artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          built=$(find artifacts -type f | wc -l)
          find artifacts -type f -exec cp -n {} out/ \;
          published=$(find out -type f | wc -l)
          if [ "$built" -ne "$published" ]; then
            echo "::error::basename collision: $built artifacts built but only $published published."
            find artifacts -type f -printf '%f\n' | sort | uniq -d
            exit 1
          fi
          echo "published $published binaries:"
          find out -type f -printf '  %f\n' | sort

      # `body_path` + `generate_release_notes` is deliberately both: the curated section leads and
      # GitHub appends its generated notes underneath.
      #
      # What those generated notes actually contain, measured on v1.2.1 rather than assumed: GitHub
      # lists **pull requests**, not commits. This repo pushes straight to `main`, so there are none
      # and the generated half reduces to a single `**Full Changelog**: …/compare/vA...vB` line.
      # That is a good outcome — the compare link is exactly "what changed since the last release",
      # with none of the noise a 45-commit list would carry — but it means `generate_release_notes`
      # ALONE would publish a release page with a title and a link and nothing else. The curated
      # section is not decoration here; it is the entire content.
      - uses: softprops/action-gh-release@v3
        with:
          files: out/*
          body_path: release-body.md
          generate_release_notes: true
