name: Release build

# Reusable cross-compile matrix — the SINGLE definition of "build the full `--features onnx`
# product and package one self-contained binary per target". It is called by two entry points
# so they can never drift:
#   * release-build-publish.yml (on a v*.*.* tag)      → then PUBLISHES the artifacts as a GitHub Release
#   * manual-build.yml          (on workflow_dispatch) → keeps them as throwaway workflow artifacts
# (The former per-push `ci.yml` caller, which built all targets as an early-warning check, is
# disabled — see ci.yml.disabled. There is no per-push CI now; verify with a manual build.)
#
# There is deliberately no publish step here: a caller that only builds therefore *cannot*
# publish, structurally, rather than by an `if` gate.
#
# Targets: one native binary per matrix row. macOS is arm64-only ON PURPOSE — `ort`'s
# `download-binaries` ships no prebuilt ONNX Runtime for `x86_64-apple-darwin` at the pinned
# `=2.0.0-rc.12`, so that target falls back to a from-source ONNX Runtime build (cmake, long,
# fragile) we do not run in CI. Intel Macs are legacy (Apple finished the arm64 transition in
# 2023); `aarch64-apple-darwin` covers every current Mac. An Intel-Mac user builds from source
# (docs/SETUP.md). Linux ships both x86_64 and arm64 (aarch64 servers are now common — Graviton
# et al.), each built natively on its own runner so there is no cross-linker to maintain.
#
# Windows ships both x86_64 and arm64 too; the arm64 leg builds NATIVELY on GitHub's free
# `windows-11-arm` runner (public-repo only). It must be native: `aws-lc-sys` (pulled in by the
# onnx feature's TLS stack) compiles its ARMv8 crypto from source and needs the ARM64 MSVC
# toolchain + clang-cl the runner provides — it cannot be cross-built from an x86_64 box.
# aarch64-pc-windows-msvc is the newest target here; despite aws-lc-sys's upstream win-arm64 build
# friction it was validated GREEN on `windows-11-arm` by a manual-build run (2026-07-15) — the native
# runner has the ARM64 MSVC toolchain aws-lc-sys needs to build its ARMv8 crypto from source.
on:
  workflow_call:
    inputs:
      retention-days:
        description: How many days to keep the uploaded artifacts.
        type: number
        required: false
        default: 7
      upload-artifacts:
        description: >-
          Upload the built binaries as workflow artifacts. Callers that only want a
          compile check across every target (ci.yml) pass false, so a per-push CI run
          builds all targets without cluttering storage with throwaway binaries.
        type: boolean
        required: false
        default: true

# Least privilege (CodeQL actions/missing-workflow-permissions). Checkout, build and
# upload-artifact need only read of repo contents — artifact upload uses the Actions
# runtime token, not GITHUB_TOKEN. A caller can only ever grant this reusable workflow
# less, never more.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: llm-proxy-pii-rust
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bin: llm-proxy-pii-rust
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: llm-proxy-pii-rust
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: llm-proxy-pii-rust.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bin: llm-proxy-pii-rust.exe
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # With per-push CI gone (ci.yml.disabled), the test suite runs HERE instead — and because
      # this reusable workflow is called by both release-build-publish.yml (on a tag) and
      # manual-build.yml, tests run on every entry point. Run on EACH target's native runner, so
      # every arch is exercised (the old CI only ran tests on x86_64 Linux). Debug profile, to match
      # the wall-clock budgets in tests/complexity.rs. Model-dependent NER tests are #[ignore]d, so
      # no model file is needed. A failure stops the leg before the expensive fat-LTO build below —
      # and, at tag time, blocks the release (a release that fails its tests never publishes).
      - name: Test (--features onnx)
        run: cargo test --features onnx

      # The release profile (Cargo.toml) is the max-optimization one: opt-level 3, fat LTO,
      # codegen-units = 1, symbols stripped. `panic` stays `unwind` ON PURPOSE — `abort` would
      # turn a caught masking panic (which currently blocks ONE request, fail-closed) into a
      # process abort, i.e. an outage. See the profile's comment.
      - name: Build (release, --features onnx)
        run: cargo build --release --features onnx --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          src="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          dest="dist/llm-proxy-pii-rust-${{ matrix.target }}"
          if [[ "${{ matrix.bin }}" == *.exe ]]; then
            dest="${dest}.exe"
          fi
          cp "$src" "$dest"

      # v7 is the current major on Node 24 (v5 still targets the deprecated Node 20, v6 was the
      # first on Node 24). upload- and download-artifact carry different latest majors because
      # they are separate repos — both are Node 24.
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.upload-artifacts }}
        with:
          name: llm-proxy-pii-rust-${{ matrix.target }}
          path: dist/*
          retention-days: ${{ inputs.retention-days }}
