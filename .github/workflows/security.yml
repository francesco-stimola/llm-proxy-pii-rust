name: Security

# Supply-chain / vulnerability scanning of the dependency graph — deliberately SEPARATE
# from the (disabled) build CI. It is cheap: cargo-deny reads `Cargo.lock`, it does not
# compile the crate, so this does not reintroduce per-push build cost. And security needs
# a cadence the tag-driven release cannot give.
#
# Triggers:
#   - PR + push-to-main, but ONLY when the dependency surface changes (paths filter) —
#     a doc-only commit does not spin this up;
#   - WEEKLY schedule — the important one: a CVE can be disclosed against a dependency you
#     already have, with no code change to trigger a run;
#   - on demand (workflow_dispatch).
# Free on public repos. See docs/ARCHITECTURE.md -> "Supply-chain & dependency security".

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/security.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo-deny (advisories, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # The action defaults to cargo 1.71, which cannot even run `cargo metadata` on
          # this tree (it pulls crates needing edition2024 -> cargo >= 1.85). cargo-deny only
          # needs a cargo new enough to READ the dependency graph — not the project MSRV — so
          # `stable` (always >= 1.85) is the lean choice: no hardcoded version to drift.
          rust-version: stable
          # advisories = RustSec CVEs (the security core); sources = registry/git trust;
          # bans = duplicate-version hygiene. `licenses` is excluded on purpose — see deny.toml.
          # (Default `arguments: --all-features` is kept, so onnx deps are scanned too.)
          command: check advisories bans sources
