# Dependabot — automated dependency maintenance. Free on public repos.
#
# This file drives Dependabot VERSION UPDATES (keep dependencies current) and their
# grouping. Dependabot ALERTS + SECURITY UPDATES (vulnerability-driven PRs from the
# GitHub Advisory DB) are SEPARATE, repo-level toggles in Settings -> Code security &
# analysis — enable them there; they do not need this file.
# See docs/ARCHITECTURE.md -> "Supply-chain & dependency security".
version: 2
updates:
  # Rust crates (Cargo). Grouped so a routine weekly bump is one PR, not a dozen.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly # was weekly — a solo repo does not need weekly dependency churn
    open-pull-requests-limit: 5
    groups:
      # One PR per run for all non-major cargo updates — low noise. If a 0.x "minor" that
      # is actually breaking (e.g. reqwest 0.12 -> 0.13) lands in the group, the CI gate
      # (ci.yml: build + test on every PR) turns the PR red, so it can't be merged blind.
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # True semver-major bumps (1.x -> 2.x) are done by hand, not auto-PR'd.
      # CAVEAT: Dependabot classifies 0.x breaking bumps (0.12 -> 0.13) as "minor", NOT
      # major — so this does NOT suppress them. ci.yml is what makes those safe.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # `ort` is pinned exactly (=2.0.0-rc.12, a prerelease) — expect any bump to need a
    # hand review regardless.

  # The GitHub Actions the workflows pin (actions/checkout, cargo-deny-action, …).
  # A stale action is its own supply-chain surface — keep them current too.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
