[package]
name = "llm-proxy-pii-rust"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A fast, privacy-preserving LLM proxy that anonymizes PII locally before requests reach any provider."
repository = "https://github.com/francesco-stimola/llm-proxy-pii-rust"
readme = "README.md"

# NOTE: dependency versions are a starting point and must be verified on the
# first `cargo build` once the toolchain is installed (see docs/ROADMAP.md M0).
[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
once_cell = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ONNX inference deps (M2), behind the optional `onnx` feature so the default
# build stays native-dep-free. `ort` 2.x is prerelease-only → pinned exactly.
# `tokenizers` uses default-features = false to avoid the C/C++ regex backends.
ort = { version = "=2.0.0-rc.12", optional = true, features = ["download-binaries"] }
tokenizers = { version = "0.23", optional = true, default-features = false, features = ["fancy-regex"] }
# HuggingFace Hub client (M2.5): opt-in, revision-pinned model fetch into the
# standard HF cache. Async API. Only pulled with the `onnx` feature — so the
# DEFAULT build stays native-dep-free. NOTE (M2.5-R1): under `--features onnx`
# hf-hub 1.x drags in a heavier transitive footprint than a bare HTTP client — a
# second `reqwest 0.13` + `hf-xet` + `rustls`/`aws-lc-rs` (native crypto). Kept on
# 1.x deliberately (the `onnx` feature is already native via `ort`; the 0.4.x
# alternative is unmaintained) — see docs/ROADMAP.md M2.5-R1.
hf-hub = { version = "1", optional = true }

[features]
default = []
onnx = ["dep:ort", "dep:tokenizers", "dep:hf-hub"]

[dev-dependencies]
# Property-based testing — the faithful port of the old proxy's Hypothesis suite
# (PROP-01/PROP-02 in docs/TESTING.md). Test-only; not in the shipped binary.
proptest = "1"
