[package]
name = "llm-proxy-pii-rust"
version = "1.2.1"
edition = "2021"
# MSRV (M4-R22, corrected by M5-R5 — see docs/reviews/M5.md#m5-r5).
#
# 1.82 was declared for OUR code (`Option::is_none_or`, src/pii/recognizers.rs) and never
# verified, because no CI job ever built on it — exactly the drift M4-R22's `rust-version` was
# supposed to prevent but structurally *cannot*: the field makes cargo refuse a too-OLD
# toolchain, it does not notice when the crate has drifted PAST the declared floor. Measured,
# it had: 1.82 cannot even parse the dependency tree (`idna_adapter` needs `edition2024`).
#
# Measured floors (`cargo +<ver> check --all-targets [--features onnx]`):
#   * default build ......... 1.86  (1.85 fails: icu_* / idna_adapter require 1.86)
#   * --features onnx ....... 1.89  (1.86-1.88 fail: konst / redb <- hf-xet require 1.89)
#
# **ONE floor: 1.89 — the higher of the two.** The shipped product runs with `onnx` ON (that is
# the whole hybrid: structured recognizers + NER), so a "default-build MSRV" of 1.86 would be a
# floor for a configuration nobody deploys — a second number to keep honest, buying nothing.
# Declaring the real floor of the real product is simpler and cannot drift apart. `default` still
# *builds* on 1.86; we just don't promise it.
#
# Verified by CI (`.github/workflows/ci.yml`, the `msrv` job) rather than asserted here — because
# a declared MSRV with no job building on it is not a floor, it is a comment shaped like one.
rust-version = "1.89"
license = "AGPL-3.0-or-later"
description = "A fast, privacy-preserving LLM proxy that anonymizes PII locally before requests reach any provider."
repository = "https://github.com/francesco-stimola/llm-proxy-pii-rust"
readme = "README.md"
# Not published to crates.io yet — kept ready for when it is. Categories are validated
# against crates.io's fixed slug list (https://crates.io/category_slugs) at publish time; these
# four are the ones that actually match what the binary does (an HTTP proxy/server, a CLI tool,
# text-scanning detection) rather than an aspirational "privacy"/"security" category, which
# crates.io doesn't have.
keywords = ["pii", "privacy", "llm", "proxy", "redaction"]
categories = ["network-programming", "web-programming::http-server", "command-line-utilities", "text-processing"]

# NOTE: dependency versions are a starting point and must be verified on the
# first `cargo build` once the toolchain is installed (see docs/ROADMAP.md M0).
[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["trace"] }
# TLS backend PINNED explicitly (default-features = false + native-tls) instead of inherited from
# reqwest's `default-tls`. reqwest 0.13 silently flipped that default from native-tls to
# rustls + aws-lc-rs — which would VENDOR AND COMPILE a crypto library into the DEFAULT build
# (tests/dependency_footprint.rs, M2.5-R1). Pinning native-tls keeps the crypto backend a
# deliberate choice rather than a dependency's shifting default, and keeps it the OS's own.
#
# READ THIS BEFORE REPEATING THE OLD CLAIM: this pin does NOT make the default build
# "native-dep-free" — that sentence stood here until 2026-07-31 and was true only on the
# platform it was written on. `native-tls` IS the platform's TLS: schannel on Windows (pure-Rust
# declarations, no C), OPENSSL on Linux (openssl-sys + cc, linking the system libssl),
# Security.framework on macOS. Both guards ran host-only, so a Windows machine reported green and
# CI's first Linux run reported red — correctly. The honest form of the rule, and the one the
# guards now check per target: the default build reaches NO native dependency except the TLS its
# operating system already provides. There is no pure-Rust escape via reqwest — rustls' providers
# (aws-lc-rs, ring) compile C too, which is why this is a reformulation and not a bug to fix.
#
# `http2`/`charset`/`system-proxy` re-add what reqwest's own
# `default` set carries, so runtime behavior matches 0.12; `json`/`stream` are what this proxy uses.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "stream", "http2", "charset", "system-proxy"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
# libphonenumber port (M8.1) — the `validate` fn of the opt-in national-phone
# recognizers (fp_prone_recognizers, PII_LOCALES). Its `is_valid()` checks a
# candidate against the region's REAL numbering plan (assigned prefixes + lengths),
# which is exactly what defuses the M4-R1 "national phone with no +CC is FP-prone"
# objection a hand-written regex could never meet (measured: GB precision 1.000,
# DE 0.909 on an adversarial corpus — docs/DEVLOG.md, M8.1). In the DEFAULT
# build ON PURPOSE — it is PURE RUST (no *-sys, nothing tests/dependency_footprint.rs
# forbids on any target, so that guard stays green). Accepted cost: ~3 MB
# of embedded worldwide metadata + a few unmaintained transitive deps (oncemutex,
# regex-cache) — see docs/ARCHITECTURE.md.
phonenumber = "0.3"
once_cell = "1"
anyhow = "1"
tracing = "0.1"
# `local-time` (→ `time/local-offset`) so log timestamps carry the operator's own clock
# with an explicit offset instead of UTC (M10). See src/logging.rs for why the offset is
# captured before the tokio runtime exists.
tracing-subscriber = { version = "0.3", features = ["env-filter", "local-time"] }
# Direct dep for `UtcOffset` + the timestamp format description. NEW in the DEFAULT build
# (M10): it was in `Cargo.lock` only under `--features onnx`, via hf-hub → hf-xet →
# tracing-appender — so "surely it's already there" was wrong, exactly as the plan warned.
# The cost is real but small and PURE RUST (`time` + `time-core`/`time-macros`, `deranged`,
# `num-conv`, `powerfmt`, `num_threads`) — nothing tests/dependency_footprint.rs
# forbids on any target, so the guarantee holds. `default-features = false` drops
# `std`'s parsing/serde surface we don't use.
time = { version = "0.3", default-features = false, features = ["std", "formatting", "local-offset", "macros"] }

# ONNX inference deps (M2), behind the optional `onnx` feature so the default
# build never reaches them. `ort` 2.x is prerelease-only → pinned exactly.
# `tokenizers` uses default-features = false to avoid the C/C++ regex backends.
ort = { version = "=2.0.0-rc.12", optional = true, features = ["download-binaries"] }
tokenizers = { version = "0.23", optional = true, default-features = false, features = ["fancy-regex"] }
# HuggingFace Hub client (M2.5): opt-in, revision-pinned model fetch into the
# standard HF cache. Async API. Only pulled with the `onnx` feature — so the
# DEFAULT build never carries it. NOTE (M2.5-R1): under `--features onnx`
# hf-hub 1.x drags in a heavier transitive footprint than a bare HTTP client — a
# second `reqwest 0.13` + `hf-xet` + `rustls`/`aws-lc-rs` (native crypto). Kept on
# 1.x deliberately (the `onnx` feature is already native via `ort`; the 0.4.x
# alternative is unmaintained) — see docs/reviews/M2.5.md#m25-r1.
hf-hub = { version = "1", optional = true }

# ---------------------------------------------------------------------------
# Per-platform accelerator (M9). `download-binaries` fetches ONE ONNX Runtime
# distribution, and that distribution decides which execution providers exist —
# so "compile in every backend" is not a thing. MEASURED: enabling six `ep-*`
# features on Windows still links against the DirectML distribution, and at
# runtime cuda/tensorrt/coreml/rocm/openvino all report unavailable and fall
# back to CPU. (That is a claim about the COMBINATION — see THE RULE's corollary
# below.) The only meaningful choice is therefore ONE accelerator per platform.
#
# Setting it here rather than in the release workflow means the same rule
# applies to a developer's `--features onnx` build and to CI, with no flag to
# remember and no way for the two to drift.
#
# ONE accelerator per platform — the natural one for that OS, so `--features onnx`
# carries the platform's GPU with no special build and a dev build cannot disagree
# with CI. Only one per platform: a single ONNX Runtime distribution carries a
# single provider set, so listing several fetches one and leaves the rest
# reporting unavailable — noise, not coverage.
#
# **THE RULE BEFORE WIRING A NEW ONE (M9-R13):** adding an EP feature per-target is
# free ONLY when `ort-sys` does not key its *distribution* on it. `resolve_dist`
# (ort-sys `build/download/resolve.rs`) builds the download key from `training`,
# `webgpu`, `cuda|tensorrt`, `nvrtx`, `rocm` — and nothing else. Check that list
# first: a feature outside it changes only which `register()` compiles; a feature
# inside it changes which tarball every build on that platform downloads, and a
# combination with no row in `dist.txt` **silently falls back** to the plain
# distribution — it builds green and the accelerator is simply absent.
#
# **Only the FREE ones live here** — the accelerators that are not distribution
# keys, so wiring them cannot change which tarball is downloaded:
#
# Windows -> DirectML. Not a key, and `build/static_link/mod.rs` links DirectML on
#            every Windows target unconditionally ("pyke libs always ship compiled
#            with DirectML on Windows"). A no-op on the artifact — provably safe on
#            both arches, no CI run needed.
# macOS   -> CoreML. Also not a key: the same tarball as before.
#
# **CUDA/WebGPU are deliberately NOT here, and that is the whole design (M9.1).**
# They ARE distribution keys, so putting `cuda` in this block swapped the download
# to `…+cu12` for *every* x86_64 Linux build — a heavier, CUDA-laden runtime
# imposed on every user whether or not they own an NVIDIA device. A key-ed
# accelerator therefore belongs in its **own release artifact**, not in everyone's
# default build: `release-build.yml` produces one binary per backend and the user
# downloads the one their machine can run. Locally the same is reachable with
# `--features ep-cuda` / `ep-webgpu`.
#
# A machine that lacks the *device* just falls back to CPU at session build, so a
# wrong guess costs latency, never a broken runtime. `--bench-providers` reports
# what each box actually got.
# See docs/ARCHITECTURE.md → "Execution providers".
[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.12", optional = true, features = ["directml"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.12", optional = true, features = ["coreml"] }

[features]
default = []
onnx = ["dep:ort", "dep:tokenizers", "dep:hf-hub"]

# ESCAPE HATCHES, not the normal path (M9). Your platform's accelerator is
# already wired per-target ABOVE, so `--features onnx` carries it and none of
# these is needed for it. They exist to force a non-default combination — a
# different backend than the platform's, or one on a platform that has none.
#
# Reaching for one is usually a mistake, and TWO of them cannot work at all with
# the prebuilt distribution: `ort-sys`'s `dist.txt` has no ROCm row for any
# target (and on Linux `ep-rocm` combines into a `cu12,rocm` key matching
# nothing, so it silently resolves to the plain distribution — STRICTLY FEWER
# providers than plain `--features onnx`), and `openvino` is not a distribution
# key at all. `ep-webgpu` is NOT one of the two: `dist.txt` has `wgpu` rows for
# Windows x64, Linux x64 and macOS arm64, so it resolves fine **on its own** —
# the link failure once recorded here came from combining it with other `ep-*`
# features (see THE RULE's corollary above). Making ROCm/OpenVINO work needs a
# from-source ONNX Runtime, which this project does not build.
# Run `--bench-providers` to see what a given binary really has.
# See docs/ARCHITECTURE.md → "Execution providers (hardware acceleration)".
ep-directml = ["onnx", "ort/directml"]
ep-cuda = ["onnx", "ort/cuda"]
ep-tensorrt = ["onnx", "ort/tensorrt"]
ep-coreml = ["onnx", "ort/coreml"]
ep-rocm = ["onnx", "ort/rocm"]
ep-openvino = ["onnx", "ort/openvino"]
ep-webgpu = ["onnx", "ort/webgpu"]

# Release profile — tuned for the shipped binary (the release workflow builds with this).
#
# The proxy is CPU-bound on the masking path (regex scans over every text field, plus NER
# inference), and that path is what the whole product's latency *is* — so it is worth paying
# build time for.
[profile.release]
opt-level = 3        # cargo's default, stated explicitly so it can't drift
lto = "fat"          # whole-program inlining across crate boundaries (regex/aho-corasick/serde)
codegen-units = 1    # no parallel-codegen barriers to inlining; slower build, faster binary
strip = "symbols"    # smaller artifact; we don't ship debuginfo

# **`panic` stays `unwind` — deliberately, and this is a correctness bar, not a preference.**
# `panic = "abort"` is the usual last squeeze here, and it would BREAK the fail-closed model:
# masking runs on `tokio::task::spawn_blocking`, and `server.rs` catches a panic in a stage as a
# JoinError and **blocks the request (fail-closed)** — because at that point we hold a body whose
# PII status is unknown (M4-R19). With `abort`, that panic kills the whole process instead of being
# caught — turning "one request is refused" into "the proxy is down", i.e. converting a contained
# fail-closed into an outage. Availability is a privacy property here: a proxy that is down
# forwards nothing, but it also protects nothing, and clients may simply fail over to the raw
# provider. Do not set it.

[dev-dependencies]
# Property-based testing — the faithful port of the old proxy's Hypothesis suite
# (PROP-01/PROP-02 in docs/TESTING.md). Test-only; not in the shipped binary.
proptest = "1"
