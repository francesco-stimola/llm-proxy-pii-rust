[package]
name = "llm-proxy-pii-rust"
version = "1.0.0"
edition = "2021"
# MSRV (M4-R22, corrected by M5-R5 — see docs/reviews/M5.md#m5-r5).
#
# 1.82 was declared for OUR code (`Option::is_none_or`, src/pii/recognizers.rs) and never
# verified, because no CI job ever built on it — exactly the drift M4-R22's `rust-version` was
# supposed to prevent but structurally *cannot*: the field makes cargo refuse a too-OLD
# toolchain, it does not notice when the crate has drifted PAST the declared floor. Measured,
# it had: 1.82 cannot even parse the dependency tree (`idna_adapter` needs `edition2024`).
#
# Measured floors (`cargo +<ver> check --all-targets [--features onnx]`):
#   * default build ......... 1.86  (1.85 fails: icu_* / idna_adapter require 1.86)
#   * --features onnx ....... 1.89  (1.86-1.88 fail: konst / redb <- hf-xet require 1.89)
#
# **ONE floor: 1.89 — the higher of the two.** The shipped product runs with `onnx` ON (that is
# the whole hybrid: structured recognizers + NER), so a "default-build MSRV" of 1.86 would be a
# floor for a configuration nobody deploys — a second number to keep honest, buying nothing.
# Declaring the real floor of the real product is simpler and cannot drift apart. `default` still
# *builds* on 1.86; we just don't promise it.
#
# Verified by CI (`.github/workflows/ci.yml`, the `msrv` job) rather than asserted here — because
# a declared MSRV with no job building on it is not a floor, it is a comment shaped like one.
rust-version = "1.89"
license = "AGPL-3.0-or-later"
description = "A fast, privacy-preserving LLM proxy that anonymizes PII locally before requests reach any provider."
repository = "https://github.com/francesco-stimola/llm-proxy-pii-rust"
readme = "README.md"

# NOTE: dependency versions are a starting point and must be verified on the
# first `cargo build` once the toolchain is installed (see docs/ROADMAP.md M0).
[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["trace"] }
# TLS backend PINNED explicitly (default-features = false + native-tls) instead of inherited from
# reqwest's `default-tls`. reqwest 0.13 silently flipped that default from native-tls to
# rustls + aws-lc-rs — which would pull aws-lc-rs into the DEFAULT build and break the
# native-dep-free guarantee (tests/dependency_footprint.rs, M2.5-R1). Pinning native-tls keeps the
# default build native-dep-free AND makes the crypto backend a deliberate choice, not a
# dependency's shifting default. `http2`/`charset`/`system-proxy` re-add what reqwest's own
# `default` set carries, so runtime behavior matches 0.12; `json`/`stream` are what this proxy uses.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "stream", "http2", "charset", "system-proxy"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
once_cell = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ONNX inference deps (M2), behind the optional `onnx` feature so the default
# build stays native-dep-free. `ort` 2.x is prerelease-only → pinned exactly.
# `tokenizers` uses default-features = false to avoid the C/C++ regex backends.
ort = { version = "=2.0.0-rc.12", optional = true, features = ["download-binaries"] }
tokenizers = { version = "0.23", optional = true, default-features = false, features = ["fancy-regex"] }
# HuggingFace Hub client (M2.5): opt-in, revision-pinned model fetch into the
# standard HF cache. Async API. Only pulled with the `onnx` feature — so the
# DEFAULT build stays native-dep-free. NOTE (M2.5-R1): under `--features onnx`
# hf-hub 1.x drags in a heavier transitive footprint than a bare HTTP client — a
# second `reqwest 0.13` + `hf-xet` + `rustls`/`aws-lc-rs` (native crypto). Kept on
# 1.x deliberately (the `onnx` feature is already native via `ort`; the 0.4.x
# alternative is unmaintained) — see docs/reviews/M2.5.md#m25-r1.
hf-hub = { version = "1", optional = true }

[features]
default = []
onnx = ["dep:ort", "dep:tokenizers", "dep:hf-hub"]

# Release profile — tuned for the shipped binary (the release workflow builds with this).
#
# The proxy is CPU-bound on the masking path (regex scans over every text field, plus NER
# inference), and that path is what the whole product's latency *is* — so it is worth paying
# build time for.
[profile.release]
opt-level = 3        # cargo's default, stated explicitly so it can't drift
lto = "fat"          # whole-program inlining across crate boundaries (regex/aho-corasick/serde)
codegen-units = 1    # no parallel-codegen barriers to inlining; slower build, faster binary
strip = "symbols"    # smaller artifact; we don't ship debuginfo

# **`panic` stays `unwind` — deliberately, and this is a correctness bar, not a preference.**
# `panic = "abort"` is the usual last squeeze here, and it would BREAK the fail-closed model:
# masking runs on `tokio::task::spawn_blocking`, and `server.rs` catches a panic in a stage as a
# JoinError and **blocks the request (fail-closed)** — because at that point we hold a body whose
# PII status is unknown (M4-R19). With `abort`, that panic kills the whole process instead of being
# caught — turning "one request is refused" into "the proxy is down", i.e. converting a contained
# fail-closed into an outage. Availability is a privacy property here: a proxy that is down
# forwards nothing, but it also protects nothing, and clients may simply fail over to the raw
# provider. Do not set it.

[dev-dependencies]
# Property-based testing — the faithful port of the old proxy's Hypothesis suite
# (PROP-01/PROP-02 in docs/TESTING.md). Test-only; not in the shipped binary.
proptest = "1"
